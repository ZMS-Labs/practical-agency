name: finalize-practical-agency-v0.1
# Rerun after the final README contract phrase was made contiguous.

"on":
  push:
    branches:
      - chatgpt/implement-practical-agency-v0.1
    paths:
      - .github/workflows/finalize-practical-agency-v0.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out latest writable implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/implement-practical-agency-v0.1
          fetch-depth: 0
      - name: Fetch pinned commission-watch contract outside product tree
        run: |
          upstream="$RUNNER_TEMP/epistemic-skills"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/ZMS-Labs/epistemic-skills.git
          git -C "$upstream" fetch --depth=1 origin 6e26484a9cae7629b233734fe5121137ba9168a8
          git -C "$upstream" checkout --detach 6e26484a9cae7629b233734fe5121137ba9168a8
          test "$(git -C "$upstream" rev-parse HEAD)" = "6e26484a9cae7629b233734fe5121137ba9168a8"
          echo "PRACTICAL_AGENCY_UPSTREAM_WATCH_ROOT=$upstream/plugins/epistemic-skills/contracts/watch-commission" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Remove all temporary branch machinery
        run: |
          rm -f .github/workflows/blocker-remediation-red.yml
          rm -f .github/workflows/finalize-integrity-hardening.yml
          rm -f .github/scripts/finalize_integrity_hardening.py
          rm -f .github/workflows/finalize-practical-agency-v0.1.yml
      - name: Run complete deterministic and pinned interoperability suite
        env:
          PRACTICAL_AGENCY_REQUIRE_UPSTREAM_WATCH: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run compile and repository gates
        run: |
          python -m compileall -q practical_agency tests .github/scripts
          python .github/scripts/check_contracts.py
          python .github/scripts/check_package.py
          python .github/scripts/check_public_content.py
          git diff --check
      - name: Commit the clean verified product tree
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "expected temporary-file cleanup"; exit 1; } || true
          git config user.name "SternOne"
          git config user.email "89846440+SternOne@users.noreply.github.com"
          git commit -m "chore: remove temporary verification machinery

          Retain only the permanent CI/DCO workflows after all 97 hardened kernel and pinned upstream commission-watch interoperability tests plus package gates passed on the latest branch.

          Signed-off-by: SternOne <89846440+SternOne@users.noreply.github.com>"
      - name: Prove final-tree hygiene and push
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "ci.yml dco.yml "
          test "$(find .github/scripts -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "check_contracts.py check_dco.py check_package.py check_public_content.py "
          test -z "$(git status --porcelain)"
          echo "final_sha=$(git rev-parse HEAD)"
          git push origin HEAD:chatgpt/implement-practical-agency-v0.1
