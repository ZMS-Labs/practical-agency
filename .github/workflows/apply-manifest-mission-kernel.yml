name: apply-manifest-mission-kernel

"on":
  push:
    branches:
      - chatgpt/manifest-mission-kernel
    paths:
      - ".github/workflows/apply-manifest-mission-kernel.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the implementation branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/manifest-mission-kernel
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reconstruct the exact verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/practical-agency-tree.part* > /tmp/practical-agency-tree.b64
          base64 -d /tmp/practical-agency-tree.b64 > /tmp/practical-agency-tree.tar.gz
          echo "e62c491a43a19f9eacbeb8eca56f767e374cdf1034aa701b84f73d81e5e36ef4  /tmp/practical-agency-tree.tar.gz" | sha256sum -c -
          git rm -rf --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/practical-agency-tree.tar.gz -C .
          test -f skills/manifest/SKILL.md
          test -f practical_agency/coordinator.py
          test -f contracts/mission-manifest.schema.json
      - name: Run the full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q practical_agency tests
          python .github/scripts/check_repo.py --self-test
          python .github/scripts/check_repo.py
          python .github/scripts/check_dco.py --self-test
      - name: Build and import the wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/practical-agency-wheelhouse /tmp/practical-agency-wheel-target
          mkdir -p /tmp/practical-agency-wheelhouse /tmp/practical-agency-wheel-target
          python -m pip wheel --no-deps --wheel-dir /tmp/practical-agency-wheelhouse .
          python -m pip install --no-deps --target /tmp/practical-agency-wheel-target /tmp/practical-agency-wheelhouse/*.whl
          (
            cd /tmp
            PYTHONPATH=/tmp/practical-agency-wheel-target python - <<'PY'
          import practical_agency
          assert practical_agency.__version__ == "0.1.0"
          print(practical_agency.__file__)
          PY
          )
      - name: Remove generated and staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist .pytest_cache
          find . -type d \( -name __pycache__ -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          test ! -d .github/bootstrap
          test ! -e .github/workflows/apply-manifest-mission-kernel.yml
      - name: Commit the exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SternOne"
          git config user.email "89846440+SternOne@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected implementation diff is empty" >&2
            exit 1
          fi
          git commit -m "feat: add the manifest mission kernel" \
            -m "Add deterministic mission custody, authority enforcement, atomic checkpoints, dynamic capability discovery, bounded coordination, independent completion, and a fail-closed watch-commission intake boundary. Preserve one public manifest skill and do not claim a production background runtime." \
            -m "Signed-off-by: SternOne <89846440+SternOne@users.noreply.github.com>"
          python .github/scripts/check_dco.py --base HEAD^ --head HEAD
      - name: Push only the tested commit
        run: git push origin HEAD:chatgpt/manifest-mission-kernel
