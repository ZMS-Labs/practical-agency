name: apply-remediation-lock

"on":
  push:
    branches:
      - chatgpt/manifest-mission-kernel
    paths:
      - ".github/workflows/apply-remediation-lock.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the implementation branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/manifest-mission-kernel
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the minimal remediation lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          coordinator = Path("practical_agency/coordinator.py")
          state_machine = Path("practical_agency/state_machine.py")

          replace_once(
              coordinator,
              '''def normalize_invocation(text: str) -> str | None:
              normalized = " ".join(text.casefold().split())
              if normalized in {"helix it", "manifest this", "carry this through"}:
                  return "manifest"
              if normalized.startswith("manifest ") or normalized.startswith("helix "):
                  return "manifest"
              return None


          def _blocked_manifest''',
              '''def normalize_invocation(text: str) -> str | None:
              normalized = " ".join(text.casefold().split())
              if normalized in {"helix it", "manifest this", "carry this through"}:
                  return "manifest"
              if normalized.startswith("manifest ") or normalized.startswith("helix "):
                  return "manifest"
              return None


          def _remediation_block(
              manifest: MissionManifest, execution_request: ActionRequest | None
          ) -> tuple[str, str] | None:
              blockers = manifest.state["blockers"]
              if not blockers:
                  return None
              required = manifest.state["next_action"]
              if not isinstance(required, str) or not required.strip():
                  return (
                      "REMEDIATION_ACTION_MISSING",
                      "load-bearing blockers exist without a recorded remediation action",
                  )
              actual = (
                  execution_request.description.strip()
                  if execution_request is not None
                  and isinstance(execution_request.description, str)
                  else None
              )
              if actual != required.strip():
                  return (
                      "EXACT_REMEDIATION_ACTION_REQUIRED",
                      f"complete the recorded remediation first: {required.strip()}",
                  )
              return None


          def _blocked_manifest''',
          )

          replace_once(
              coordinator,
              '''        if manifest.authority["revoked"] or manifest.state["status"] in {"completed", "cancelled"}:
                      return CoordinationDecision("BLOCK", "mission authority is unavailable or terminal", None, None)

                  if requested_capability_id is not None:''',
              '''        if manifest.authority["revoked"] or manifest.state["status"] in {"completed", "cancelled"}:
                      return CoordinationDecision("BLOCK", "mission authority is unavailable or terminal", None, None)

                  remediation_block = _remediation_block(manifest, execution_request)
                  if remediation_block is not None:
                      code, detail = remediation_block
                      return CoordinationDecision("BLOCK", f"{code}: {detail}", None, None)

                  if requested_capability_id is not None:''',
          )

          replace_once(
              coordinator,
              '''        adapter_ref = getattr(adapter, "adapter_ref", None)
                  if not isinstance(adapter_ref, str) or not adapter_ref.strip():
                      raise ValueError("ADAPTER_REF_REQUIRED: execution adapter must identify itself")

                  authority = evaluate_action(manifest, request)
                  request_id = f"exec:{manifest.mission_id}:r{manifest.revision}:{request.action_id}"
                  if not authority.allowed:''',
              '''        adapter_ref = getattr(adapter, "adapter_ref", None)
                  if not isinstance(adapter_ref, str) or not adapter_ref.strip():
                      raise ValueError("ADAPTER_REF_REQUIRED: execution adapter must identify itself")

                  request_id = f"exec:{manifest.mission_id}:r{manifest.revision}:{request.action_id}"
                  remediation_block = _remediation_block(manifest, request)
                  if remediation_block is not None:
                      code, detail = remediation_block
                      receipt = {
                          "schema": "execution-receipt@1",
                          "request_id": request_id,
                          "adapter_ref": adapter_ref,
                          "status": "blocked",
                          "observed_effects": [
                              {"kind": "remediation-lock", "code": code, "detail": detail}
                          ],
                          "artifact_refs": [],
                          "recorded_at": self._recorded_at(),
                          "coverage_limits": [code],
                      }
                      return manifest, receipt

                  authority = evaluate_action(manifest, request)
                  if not authority.allowed:''',
          )

          replace_once(
              state_machine,
              '    if target_value in {"blocked", "paused"} and not reason:\n',
              '''    if target_value in {"verifying", "completed"} and manifest.state["blockers"]:
                  raise TransitionError(
                      "UNRESOLVED_BLOCKERS: exact recorded remediation must complete first"
                  )
              if target_value in {"blocked", "paused"} and not reason:
          ''',
          )
          PY
      - name: Run remediation regression tests
        run: python -m unittest tests.test_blocker_remediation -v
      - name: Run the full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q practical_agency tests
          python .github/scripts/check_repo.py --self-test
          python .github/scripts/check_repo.py
          python .github/scripts/check_dco.py --self-test
      - name: Build and import the wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/practical-agency-remediation-wheel /tmp/practical-agency-remediation-target
          mkdir -p /tmp/practical-agency-remediation-wheel /tmp/practical-agency-remediation-target
          python -m pip wheel --no-deps --wheel-dir /tmp/practical-agency-remediation-wheel .
          python -m pip install --no-deps --target /tmp/practical-agency-remediation-target /tmp/practical-agency-remediation-wheel/*.whl
          (cd /tmp && PYTHONPATH=/tmp/practical-agency-remediation-target python -c "import practical_agency; assert practical_agency.__version__ == '0.1.0'")
      - name: Commit and push only the tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SternOne"
          git config user.email "89846440+SternOne@users.noreply.github.com"
          git add practical_agency/coordinator.py practical_agency/state_machine.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix: require exact blocker remediation before mission progress" \
            -m "Prevent capability diversion, unrelated dispatch, verification, and direct lifecycle bypass while load-bearing blockers remain. Allow only the exact recorded remediation action and keep a blocked direct dispatch non-mutating." \
            -m "Signed-off-by: SternOne <89846440+SternOne@users.noreply.github.com>"
          python .github/scripts/check_dco.py --base origin/main --head HEAD
          git push origin HEAD:chatgpt/manifest-mission-kernel
